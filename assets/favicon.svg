<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="snakeFavGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="#090d16"/>
  <path d="M 12 48 C 12 30, 24 30, 28 36 C 32 42, 44 42, 46 26 C 48 14, 38 12, 34 16" fill="none" stroke="url(#snakeFavGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- Snake Head -->
  <circle cx="34" cy="16" r="6" fill="#38bdf8"/>
  <circle cx="36" cy="14" r="1.5" fill="#090d16"/>
  <!-- Flicking Tongue -->
  <path d="M 38 13 L 45 10 M 45 10 L 48 8 M 45 10 L 48 12" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round"/>
</svg>
