<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="spaceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="neonViper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <rect width="600" height="350" fill="url(#spaceBg)" rx="12" />
  
  <!-- Ambient Grid Lines -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.4">
    <line x1="0" y1="70" x2="600" y2="70" />
    <line x1="0" y1="140" x2="600" y2="140" />
    <line x1="0" y1="210" x2="600" y2="210" />
    <line x1="0" y1="280" x2="600" y2="280" />
    <line x1="120" y1="0" x2="120" y2="350" />
    <line x1="240" y1="0" x2="240" y2="350" />
    <line x1="360" y1="0" x2="360" y2="350" />
    <line x1="480" y1="0" x2="480" y2="350" />
  </g>

  <!-- Glowing Food Orbs -->
  <circle cx="480" cy="110" r="10" fill="#f59e0b" filter="url(#neonGlow)" />
  <circle cx="150" cy="240" r="8" fill="#ec4899" filter="url(#neonGlow)" />
  <circle cx="320" cy="80" r="9" fill="#10b981" filter="url(#neonGlow)" />

  <!-- Mouse Cursor Pointer -->
  <g transform="translate(420, 140)">
    <polygon points="0,0 6,24 12,17 22,22 25,18 15,13 22,9" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="24" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4,4" opacity="0.6"/>
  </g>

  <!-- S-Curve Slithering Snake Body -->
  <path d="M 80 280 C 140 280, 160 180, 220 220 C 280 260, 320 160, 380 150" fill="none" stroke="url(#neonViper)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)"/>
  
  <!-- Snake Head -->
  <circle cx="385" cy="150" r="15" fill="#38bdf8" filter="url(#neonGlow)"/>
  <circle cx="390" cy="144" r="3.5" fill="#0f172a"/>
  <circle cx="390" cy="156" r="3.5" fill="#0f172a"/>
  <circle cx="391" cy="143" r="1" fill="#38bdf8"/>
  <circle cx="391" cy="155" r="1" fill="#38bdf8"/>

  <!-- Forked Tongue -->
  <path d="M 398 150 L 414 148 M 414 148 L 422 143 M 414 148 L 422 153" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" filter="url(#neonGlow)"/>

  <!-- Title Badge -->
  <rect x="30" y="30" width="220" height="34" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="#334155" />
  <text x="45" y="52" font-family="sans-serif" font-size="13" font-weight="bold" fill="#38bdf8">🐍 Interactive Cursor Snake</text>
</svg>
